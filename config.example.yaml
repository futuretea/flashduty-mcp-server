# FlashDuty MCP Server Configuration Example
#
# Configuration Priority (highest to lowest):
# 1. Command-line flags: --port=8080 --app-key=...
# 2. Environment variables: FLASHDUTY_MCP_PORT=8080 FLASHDUTY_MCP_APP_KEY=...
# 3. Configuration file: config.yaml
# 4. Default values
#
# Environment Variable Format:
# - Prefix: FLASHDUTY_MCP_
# - Field name conversion: Replace hyphens and dots with underscores
# - Examples:
#   FLASHDUTY_MCP_PORT=8080
#   FLASHDUTY_MCP_SSE_BASE_URL=https://example.com
#   FLASHDUTY_MCP_APP_KEY=your-app-key
#   FLASHDUTY_MCP_BASE_URL=https://api.flashcat.cloud
#   FLASHDUTY_MCP_LOG_LEVEL=5

# Server configuration
port: 0  # 0 means stdio mode for MCP client integration
# For HTTP/SSE mode, set a port like 8080
# port: 8080

# SSE (Server-Sent Events) configuration
# sse_base_url: https://your-domain.com:8080  # Public base URL for SSE endpoint

log_level: 5  # Log level 0-9 (default: 5, Info)

# FlashDuty API configuration
# Get the app_key from your FlashDuty account:
# https://console.flashcat.cloud -> Personal Settings -> API Keys
app_key: your-app-key-here

# FlashDuty API base URL (default: https://api.flashcat.cloud)
# base_url: https://api.flashcat.cloud

# Security configuration
read_only: false  # Set to true to disable write operations (create, ack, resolve, reopen, snooze, comment, close)

# Tool enable/disable configuration
enabled_tools: []  # Enable specific tools (empty means all enabled)
disabled_tools: []  # Disable specific tools
